<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TechNova Solutions</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<header class="site-header">
    <nav class="navbar container">
        <a class="brand" href="index.html">TechNova<span>Solutions</span></a>
        <a href="index.html">Back to Home</a>
    </nav>
</header>

<main class="auth-main">
    <section class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <p class="muted">Access your company dashboard.</p>

        <div id="message" class="message hidden"></div>

        <form id="login-form">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email">

            <label for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password">

            <button id="login-button" class="btn btn-primary btn-full" type="submit">Login</button>
        </form>

        <p class="form-footer">
            New employee?
            <a href="register.html">Create an account</a>
        </p>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
