<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Department of Computer Science</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><header class="navbar">
  <div class="container nav-container">
    <a href="index.html" class="logo">
      <div class="logo-icon">PU</div>
      <div class="logo-text"><strong>Computer Science</strong><span>Pondicherry University</span></div>
    </a>
    <nav class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link" data-page="home">Home</a>
      <a href="about.html" class="nav-link" data-page="about">About Us</a>
      <a href="dashboard.html" class="nav-link auth-only" data-page="dashboard">Dashboard</a>
      <a href="login.html" class="nav-link guest-only">Login</a>
      <a href="register.html" class="nav-button guest-only">Register</a>
      <button class="nav-logout auth-only" id="logoutButton" type="button">Logout</button>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
  </div>
</header>
<main class="auth-container"><div class="auth-card register-card"><div class="auth-header"><div class="auth-icon">👤</div><h1>Create Student Account</h1><p>Register using your department student information</p></div>
<form id="registerForm" novalidate>
<div class="form-row"><div class="form-group"><label for="fullName">Full Name</label><input id="fullName" required><small class="error-message" id="fullNameError"></small></div>
<div class="form-group"><label for="studentID">Student ID</label><input id="studentID" required><small class="error-message" id="studentIDError"></small></div></div>
<div class="form-row"><div class="form-group"><label for="email">Email Address</label><input type="email" id="email" required><small class="error-message" id="emailError"></small></div>
<div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" inputmode="numeric" maxlength="10" required><small class="error-message" id="phoneError"></small></div></div>
<div class="form-row"><div class="form-group"><label for="dob">Date of Birth</label><input type="date" id="dob" required><small class="error-message" id="dobError"></small></div>
<div class="form-group"><label for="gender">Gender</label><select id="gender" required><option value="">Select Gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="other">Other</option></select><small class="error-message" id="genderError"></small></div></div>
<div class="form-row"><div class="form-group"><label for="course">Course</label><select id="course" required><option value="">Select Course</option><option value="MCA">MCA</option><option value="MSc CS">MSc CS</option><option value="MSc DA">MSc DA</option><option value="MTech">MTech</option><option value="BSc CS">BSc CS</option><option value="BSc Integ">BSc Integ</option></select><small class="error-message" id="courseError"></small></div>
<div class="form-group"><label for="bloodGroup">Blood Group</label><select id="bloodGroup" required><option value="">Select Blood Group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select><small class="error-message" id="bloodGroupError"></small></div></div>
<div class="form-group"><label for="address">Address</label><textarea id="address" rows="3" required placeholder="Enter your current address"></textarea><small class="error-message" id="addressError"></small></div>
<div class="form-row"><div class="form-group"><label for="password">Password</label><div class="password-wrapper"><input type="password" id="password" minlength="6" required><button type="button" class="password-toggle" data-target="password">Show</button></div><small class="password-hint">Use at least 6 characters.</small><small class="error-message" id="passwordError"></small></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="password-wrapper"><input type="password" id="confirmPassword" required><button type="button" class="password-toggle" data-target="confirmPassword">Show</button></div><small class="error-message" id="confirmPasswordError"></small></div></div>
<button type="submit" class="btn btn-primary btn-full">Create Account</button><div id="registerMessage" class="form-message"></div></form>
<div class="auth-footer">Already have an account? <a href="login.html">Login here</a></div></div></main>
<script src="js/main.js"></script><script src="js/register.js"></script></body></html>
