<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Department of Computer Science</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><header class="navbar">
  <div class="container nav-container">
    <a href="index.html" class="logo">
      <div class="logo-icon">PU</div>
      <div class="logo-text"><strong>Computer Science</strong><span>Pondicherry University</span></div>
    </a>
    <nav class="nav-menu" id="navMenu">
      <a href="index.html" class="nav-link" data-page="home">Home</a>
      <a href="about.html" class="nav-link" data-page="about">About Us</a>
      <a href="dashboard.html" class="nav-link auth-only" data-page="dashboard">Dashboard</a>
      <a href="login.html" class="nav-link guest-only">Login</a>
      <a href="register.html" class="nav-button guest-only">Register</a>
      <button class="nav-logout auth-only" id="logoutButton" type="button">Logout</button>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
  </div>
</header>
<main class="auth-container"><div class="auth-card login-card"><div class="auth-header"><div class="auth-icon">🔐</div><h1>Welcome Back</h1><p>Login to your department student account</p></div>
<form id="loginForm" novalidate>
<div class="form-group"><label for="identifier">Email or Student ID</label><input type="text" id="identifier" placeholder="Enter email or student ID" required><small class="error-message" id="identifierError"></small></div>
<div class="form-group"><div class="label-row"><label for="loginPassword">Password</label></div><div class="password-wrapper"><input type="password" id="loginPassword" placeholder="Enter your password" required><button type="button" class="password-toggle" data-target="loginPassword">Show</button></div><small class="error-message" id="loginPasswordError"></small></div>
<button type="submit" class="btn btn-primary btn-full">Login</button><div id="loginMessage" class="form-message"></div></form>
<div class="auth-footer">Don't have an account? <a href="register.html">Create an account</a></div></div></main>
<script src="js/main.js"></script><script src="js/login.js"></script></body></html>
