<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive calculator with normal and scientific modes.">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div>
          <h1>Calculator</h1>
          <p id="modeLabel">Standard mode</p>
        </div>

        <button id="modeToggle" class="mode-toggle" type="button" aria-pressed="false">
          <span class="toggle-icon">ƒx</span>
          <span>Scientific</span>
        </button>
      </header>

      <div class="display">
        <div id="history" class="history" aria-live="polite"></div>
        <div id="expression" class="expression" aria-label="Current expression">0</div>
        <div id="result" class="result" aria-live="polite">0</div>
      </div>

      <div id="scientificPanel" class="scientific-panel" hidden>
        <button class="key function" data-action="constant" data-value="PI">π</button>
        <button class="key function" data-action="constant" data-value="E">e</button>
        <button class="key function" data-action="function" data-value="sin">sin</button>
        <button class="key function" data-action="function" data-value="cos">cos</button>
        <button class="key function" data-action="function" data-value="tan">tan</button>
        <button class="key function" data-action="function" data-value="log">log</button>
        <button class="key function" data-action="function" data-value="ln">ln</button>
        <button class="key function" data-action="function" data-value="sqrt">√</button>
        <button class="key function" data-action="square">x²</button>
        <button class="key function" data-action="power">xʸ</button>
      </div>

      <div class="keypad">
        <button class="key danger" data-action="clear">AC</button>
        <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-value="/" data-action="operator">÷</button>

        <button class="key" data-value="7" data-action="number">7</button>
        <button class="key" data-value="8" data-action="number">8</button>
        <button class="key" data-value="9" data-action="number">9</button>
        <button class="key operator" data-value="*" data-action="operator">×</button>

        <button class="key" data-value="4" data-action="number">4</button>
        <button class="key" data-value="5" data-action="number">5</button>
        <button class="key" data-value="6" data-action="number">6</button>
        <button class="key operator" data-value="-" data-action="operator">−</button>

        <button class="key" data-value="1" data-action="number">1</button>
        <button class="key" data-value="2" data-action="number">2</button>
        <button class="key" data-value="3" data-action="number">3</button>
        <button class="key operator" data-value="+" data-action="operator">+</button>

        <button class="key utility" data-action="sign">±</button>
        <button class="key" data-value="0" data-action="number">0</button>
        <button class="key" data-value="." data-action="decimal">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <footer class="footer">
        <span>Keyboard supported</span>
        <span>•</span>
        <span>Responsive design</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
